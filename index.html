<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Redirect automatico dopo 3 secondi -->
    <meta http-equiv="refresh" content="3;url=https://www.burrini.com">
    <title>Reindirizzamento a Burrini.com</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            color: #111;
        }
        p {
            line-height: 1.6;
            color: #555;
        }
        a.btn {
            display: inline-block;
            margin: 20px 0;
            padding: 12px 24px;
            background-color: #0066cc;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }
        a.btn:hover {
            background-color: #004b99;
        }
        .contacts {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: left;
            font-size: 0.95rem;
        }
        .contacts h2 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #222;
        }
        .contacts p {
            margin: 6px 0;
        }
        .contacts a {
            color: #0066cc;
            text-decoration: none;
        }
        .contacts a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Stai per essere reindirizzato</h1>
        <p>Verrai reindirizzato automaticamente al sito principale tra pochi secondi.</p>
        
        <a href="https://www.burrini.com" class="btn">Vai subito a www.burrini.com</a>

        <div class="contacts">
            <h2>Contatti Diretti</h2>
            <p><strong>Email:</strong> <a href="mailto:info@burrini.com">info@burrini.com</a></p>
            <p><strong>Telefono:</strong> <a href="tel:+390000000000">+39 000 000 0000</a></p>
            <p><strong>Indirizzo:</strong> Madonna di Campiglio (TN), Italia</p>
        </div>
    </div>

    <script>
        // Redirect immediato via JS (se abilitato), altrimenti rimane attivo il meta refresh a 3s
        setTimeout(function() {
            window.location.href = "https://www.burrini.com";
        }, 3000);
    </script>

</body>
</html>
